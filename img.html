    <h1>
        <mark>Image Tag</mark>
    </h1>
    <p>
        Demonstration of image tag in html:
    </p>
    <a href="https://www.instagram.com" target="_blank">
        <img id="image1" src="https://www.quackit.com/pix/stock/png/html_tutorial_500x200_2.png" alt="code"
            title="This is image of code">
    </a>
    <br>
    <comment>Use of anchor tag as hyperlink</comment>
    <br>
    <hr>

    <!-- image mapping -->

    <img usemap="#img2" id="image2" src="https://www.quackit.com/pix/stock/png/html_tutorial_500x200_2.png" alt="code"
        title="This is image of code">
        <br>
        <comment>Use of image mapping</comment>
        <hr>
    <map name="img2">
        <area shape="rect" coords="0,0,250,200" href="https://www.google.com" alt="Google" target="_blank">
    </map>

    <!-- picture tag which is used for seo optimization and loading the web page faster  -->

    <picture>
        <source srcset="https://www.quackit.com/pix/stock/png/html_tutorial_500x200_2.png" media="(max-width: 600px)">
        <img src="https://www.quackit.com/pix/stock/png/html_tutorial_500x200_2.png" alt="code"
            title="This is image of code">
    </picture>
    <br>
    <comment>(picture tag) is Used as for seo optimization and loading the web page faster</comment>
    <hr>

    <!-- figure tag is used to group media content and figcaption is used to provide caption for the media content -->
       <figure>
        <img src="https://www.quackit.com/pix/stock/png/html_tutorial_500x200_2.png" alt="code"
            title="This is image of code">
        <figcaption>This is example figcaption figure tag </figcaption>
    </figure>
    <hr>
</body>
